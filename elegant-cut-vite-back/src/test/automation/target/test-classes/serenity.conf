# 1. Configuración de Navegador (Chrome)
webdriver {
  driver = chrome
  autodownload = true
}

# 2. Configuración de la URL base del navegador (AQUÍ ESTÁ LA SOLUCIÓN)
# Esto le dice a Serenity: "Todo lo que diga Open.url("/login") debe interpretarlo como http://localhost:5173/login"
serenity.restart.browser.at.start = true
webdriver.base.url = "http://localhost:5173"

# 3. Configuración de Ejecución
serenity {
  take.screenshots = FOR_EACH_ACTION
  console.colors = true
} 